name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # n8n 2.x requires Node 24, and the release workflow builds on 24; the dev tooling
        # (@n8n/node-cli 0.55, npm 11 lockfile) does not install on older npm.
        node-version: ['24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package ships no runtime dependencies
        # The published package has zero dependencies; n8n-workflow is a peer provided by n8n itself.
        run: |
          node -e "const p=require('./package.json'); const d=Object.keys(p.dependencies||{}); if (d.length) { throw new Error('Runtime dependencies are not allowed: ' + d.join(', ')); }"

      - name: Audit dev tooling (informational)
        # Findings come from n8n's own packages (e.g. zod via n8n-workflow) and are not shipped;
        # fixing them would need an "overrides" field, which n8n verification forbids.
        run: npm audit --omit=dev --omit=peer --audit-level=high || true

      - name: Inspect package artifact
        run: npm pack --dry-run

      - name: Verify npm publish lifecycle
        run: RELEASE_MODE=true npm publish --dry-run --access public --tag "$NPM_CONFIG_TAG"
        env:
          NPM_CONFIG_TAG: ${{ vars.NPM_DIST_TAG || 'latest' }}
